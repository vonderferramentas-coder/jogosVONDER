<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caça-Palavras VONDER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-frame">

  <!-- TELA 1: ABERTURA -->
  <section id="screen-intro" class="screen active">
    <a class="back-link" href="../">‹ Voltar</a>
    <img class="intro-top" src="../assets/screens/abertura_top.png" alt="">
    <div class="intro-box">
      <h1 class="intro-title">BEM-VINDO!</h1>
      <p class="intro-subtitle">Desafie sua atenção<br>e mostre que você é fera!</p>
      <div class="intro-rules">
        <p><span class="rule-icon">🔎</span> Encontre todas as palavras para vencer.</p>
        <p><span class="rule-icon">⏱️</span> Você terá apenas 1 minuto para caçar!</p>
      </div>
      <button id="btn-start" class="btn-yellow">Vamos jogar!</button>
    </div>
  </section>

  <!-- TELA 2: JOGO -->
  <section id="screen-game" class="screen">
    <a class="back-link" href="../">‹ Voltar</a>
    <div class="timer-pill">
      <span class="timer-icon">⏱</span>
      <span id="timer-text">01:00</span>
    </div>

    <div class="panel header-panel">
      <div class="search-icon">🔍</div>
      <div class="header-text">
        <h2><span class="white">CAÇA</span> <span class="yellow">PALAVRAS</span></h2>
        <p>ENCONTRE AS PALAVRAS ESCONDIDAS!</p>
      </div>
    </div>

    <div class="panel grid-panel">
      <div id="board" class="board"></div>
    </div>

    <div class="word-list-wrap">
      <h3>PALAVRAS PARA ENCONTRAR:</h3>
      <ul id="word-list" class="word-list"></ul>
    </div>

    <div class="stripe-bar"></div>
    <img class="footer-logo" src="../assets/screens/footer_logo.png" alt="É bom trabalhar com VONDER">
  </section>

  <!-- TELA 3: VITÓRIA -->
  <section id="screen-win" class="screen" style="background-image:url('../assets/screens/ganhou.png');">
    <button id="btn-finish-win" class="hit-area" aria-label="Finalizar"></button>
  </section>

  <!-- TELA 4: DERROTA -->
  <section id="screen-lose" class="screen" style="background-image:url('../assets/screens/perdeu.png');">
    <button id="btn-finish-lose" class="hit-area" aria-label="Finalizar"></button>
  </section>

</div>
<script src="script.js"></script>
</body>
</html>
