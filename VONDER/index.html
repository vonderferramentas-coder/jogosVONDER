<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogos VONDER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-frame">

  <section id="screen-select" class="screen active">
    <img class="intro-top" src="assets/screens/abertura_top.png" alt="">
    <div class="select-box">
      <h1 class="select-title">ESCOLHA SEU JOGO!</h1>
      <p class="select-subtitle">Desafie sua mente e concorra<br>a brindes VONDER!</p>

      <a class="game-card" href="jogo-da-memoria/">
        <span class="game-icon">🧠</span>
        <span class="game-text">
          <span class="game-name">Jogo da Memória</span>
          <span class="game-desc">Encontre todos os pares e vença o tempo.</span>
        </span>
        <span class="game-arrow">›</span>
      </a>

      <a class="game-card" href="caca-palavras/">
        <span class="game-icon">🔍</span>
        <span class="game-text">
          <span class="game-name">Caça-Palavras</span>
          <span class="game-desc">Ache as palavras escondidas na grade.</span>
        </span>
        <span class="game-arrow">›</span>
      </a>

      <a class="game-card" href="quiz/">
        <span class="game-icon">❓</span>
        <span class="game-text">
          <span class="game-name">Quiz VONDER</span>
          <span class="game-desc">Responda 3 perguntas sobre a marca.</span>
        </span>
        <span class="game-arrow">›</span>
      </a>
    </div>
    <div class="stripe-bar"></div>
    <img class="footer-logo" src="assets/screens/footer_logo.png" alt="É bom trabalhar com VONDER">
  </section>

</div>
</body>
</html>
