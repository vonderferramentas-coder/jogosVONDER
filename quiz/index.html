<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FDBE0F">
<title>Quiz VONDER</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../settings.css?v=4">
<script src="../totem-scale.js"></script>
<script src="../pwa.js" defer></script>
</head>
<body data-settings-page="quiz">
<div class="app-frame">

  <!-- TELA 1: ABERTURA -->
  <section id="screen-intro" class="screen active">
    <a class="back-link" href="../">‹ Voltar</a>
    <img class="intro-top" src="../assets/screens/abertura_top.png" alt="">
    <div class="intro-box">
      <h1 class="intro-title">BEM-VINDO!</h1>
      <p class="intro-subtitle">Teste seus conhecimentos sobre<br>ferramentas e a VONDER!</p>
      <button id="btn-start" class="btn-yellow">Vamos jogar!</button>
      <div class="intro-rules">
        <p id="quiz-count-rule"><span class="rule-icon">❓</span> Responda 3 perguntas sobre ferramentas.</p>
        <p id="quiz-prize-rule"><span class="rule-icon">🏆</span> Acerte 100% para garantir o brinde!</p>
      </div>
    </div>
  </section>

  <!-- TELA 2: QUIZ -->
  <section id="screen-game" class="screen">
    <a class="back-link" href="../">‹ Voltar</a>
    <div class="timer-pill">
      <span class="timer-icon">❓</span>
      <span id="progress-text">Pergunta 1/3</span>
    </div>

    <div class="panel header-panel">
      <div class="search-icon">❓</div>
      <div class="header-text">
        <h2><span class="white">QUIZ</span> <span class="yellow">VONDER</span></h2>
        <p>RESPONDA CORRETAMENTE PARA VENCER!</p>
      </div>
    </div>

    <div class="panel question-panel">
      <p id="question-text" class="question-text"></p>
    </div>

    <div id="options" class="options"></div>

    <div class="stripe-bar"></div>
    <img class="footer-logo" src="../assets/screens/footer_logo.png" alt="É bom trabalhar com VONDER">
  </section>

  <!-- TELA 3: VITÓRIA -->
  <section id="screen-win" class="screen" style="background-image:url('../assets/screens/ganhou.png');">
    <div class="result-overlay">
      <h2>PARABÉNS!</h2>
      <p id="win-result-text"></p>
    </div>
    <button id="btn-finish-win" class="hit-area" aria-label="Finalizar"></button>
  </section>

  <!-- TELA 4: DERROTA -->
  <section id="screen-lose" class="screen" style="background-image:url('../assets/screens/perdeu.png');">
    <div class="result-overlay">
      <h2>AH, QUE PENA!</h2>
      <p id="lose-result-text"></p>
    </div>
    <button id="btn-finish-lose" class="hit-area" aria-label="Finalizar"></button>
  </section>

</div>
<script src="../settings.js?v=4"></script>
<script src="script.js?v=4"></script>
</body>
</html>
